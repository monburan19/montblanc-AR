<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM CRITICAL ERROR</title>
    <style>
        body {
            background-color: #000;
            color: #0ABAB5; /* Tiffany Blue */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.05s;
        }

        #terminal-container {
            width: 95%;
            height: 90vh;
            overflow: hidden;
        }

        #terminal {
            font-size: 11px; /* 情報を詰め込むために小さく */
            line-height: 1.1;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* 高速切り替え用のクラス */
        .flash-red { background-color: #ff0000 !important; color: #fff !important; }
        .flash-white { background-color: #ffffff !important; color: #000 !important; }
        .flash-blue { background-color: #0ABAB5 !important; color: #fff !important; }

        .error { color: #ff3e3e; font-weight: bold; background: #200; }
        .success { color: #fff; text-shadow: 0 0 5px #0ABAB5; }

        /* スキャン線のノイズ */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script>
        // 大量のダミーログを生成して「高速」を演出
        const baseLogs = [
            "> OVERRIDING KERNEL...",
            "> BYPASSING SECURITY...",
            "> EXTRACTING RSA_KEYS...",
            "> INJECTING MONT_BLANK.v3...",
            "> CHMOD 777 /SYSTEM/ROOT",
            "> RM -RF /USER/SECURITY",
            "> TCP_NODELAY: ACTIVATED",
            "> [CRITICAL] BUFFER OVERFLOW",
            "> SYNCING CLOTHING_ID...",
            "> EXECUTING PAYLOAD...",
            "> STACK TRACE: 0x0045F2",
            "> MONT BLANK CORE INJECTED"
        ];

        // ログを100行分ランダムに生成
        const logs = [];
        for(let i=0; i<150; i++) {
            const randomLine = baseLogs[Math.floor(Math.random() * baseLogs.length)];
            logs.push(`${randomLine} [${(Math.random()*1000).toFixed(0)}]`);
        }
        logs.push("> FATAL ERROR: HARDWARE BREACH DETECTED.");
        logs.push("> SYSTEM LOCKED BY MONT BLANK.");

        const terminal = document.getElementById('terminal');
        let index = 0;

        function typeLog() {
            if (index < logs.length) {
                const line = document.createElement('div');
                line.textContent = logs[index];

                // 確率でエラー色にする
                if (Math.random() > 0.8) line.className = 'error';
                if (logs[index].includes('MONT BLANK')) line.className = 'success';

                terminal.appendChild(line);
                
                // 画面を一番下まで強制スクロール
                terminal.parentElement.scrollTop = terminal.parentElement.scrollHeight;

                // ページ（背景）の高速切り替え演出
                if (index % 10 === 0) {
                    document.body.classList.add('flash-red');
                    setTimeout(() => document.body.classList.remove('flash-red'), 30);
                } else if (index % 15 === 0) {
                    document.body.classList.add('flash-blue');
                    setTimeout(() => document.body.classList.remove('flash-blue'), 30);
                }

                index++;
                
                // 速度を極限まで上げる (5ms〜20ms)
                setTimeout(typeLog, 15);
            } else {
                // 最後に真っ白にしてフリーズ
                setTimeout(() => {
                    document.body.className = 'flash-white';
                    document.body.innerHTML = "<h1 style='font-size:2rem; letter-spacing:10px;'>MONT BLANK<br>OVERWRITE COMPLETE</h1>";
                }, 500);
            }
        }

        // 開始
        setTimeout(typeLog, 500);
    </script>
</body>
</html>
