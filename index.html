<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kernel_panic_dump</title>
    <style>
        body {
            background-color: #050505;
            color: #0ABAB5;
            font-family: "Lucida Console", Monaco, monospace;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            text-shadow: 0 0 2px rgba(10, 186, 181, 0.5);
        }

        #console {
            padding: 15px;
            font-size: 10px;
            line-height: 1.2;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .alert { color: #ff0033; background: rgba(255, 0, 51, 0.1); }
        .success { color: #fff; }

        /* 画面の物理的な崩壊演出 */
        .glitch-vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="console"></div>
    <div class="glitch-vignette"></div>

    <script>
        const consoleEl = document.getElementById('console');
        
        // リアルなシステムメッセージ群
        const coreLogs = [
            "ld-linux-x86-64.so.2: shared object 'libmontblank.so.1' loaded at 0x7f8a92...",
            "Process ID: [RANDOM_PID] - State: RUNNING",
            "mmap(NULL, 8192, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0) = 0x7f8a...",
            "RECV_BUF: TCP_STREAM_INIT_SUCCESS",
            "Infiltrating /sys/class/net/eth0/address...",
            "EXT4-fs (vda1): mounting ext4 file system using data=ordered",
            "CRITICAL: kernel_thread_check: failed to verify vendor_id",
            "MONT_BLANK_CORE: Attempting privilege escalation (UID: 0)...",
            "0x00000000 00 00 00 00 00 00 00 00  ........",
            "0x00000010 FF FF FF FF FF FF FF FF  ........",
            "[SYSTEM] Memory dump initiated at /dev/mem",
            "ALERT: Unrecognized clothing_id detected. Overwriting local_cfg..."
        ];

        let lineCount = 0;

        function addLine() {
            const line = document.createElement('div');
            
            // 90%は通常ログ、10%は文字化けやエラー
            if (Math.random() > 0.92) {
                line.className = 'alert';
                line.textContent = `!! FATAL EXCEPTION 0x${Math.floor(Math.random()*16777215).toString(16).toUpperCase()} !!`;
            } else if (Math.random() > 0.95) {
                line.className = 'success';
                line.textContent = "> MONT BLANK: " + btoa(Math.random()).substring(0, 20);
            } else {
                line.textContent = coreLogs[Math.floor(Math.random() * coreLogs.length)]
                                    .replace("[RANDOM_PID]", Math.floor(Math.random()*9999));
            }

            consoleEl.appendChild(line);
            
            // 行数が増えたら古いものを消して重さを防ぐ
            if (consoleEl.childNodes.length > 50) {
                consoleEl.removeChild(consoleEl.firstChild);
            }

            lineCount++;

            // 演出の緩急
            let nextDelay = Math.random() * 50; // 基本は高速
            if (lineCount % 20 === 0) nextDelay = 800; // たまに解析で止まる
            if (lineCount % 45 === 0) nextDelay = 2000; // 長めのフリーズ

            // 最終局面
            if (lineCount < 250) {
                setTimeout(addLine, nextDelay);
            } else {
                triggerFinalCrash();
            }
        }

        function triggerFinalCrash() {
            // 文字をバラバラにする演出
            document.body.style.filter = "invert(1) contrast(200%)";
            consoleEl.style.transform = "skewX(20deg)";
            setTimeout(() => {
                document.body.innerHTML = "";
                document.body.style.backgroundColor = "#000";
                // 最後にポツンと、スキャンした人への「所有権の主張」を表示
                const finalMsg = document.createElement('div');
                finalMsg.style.cssText = "color:#0ABAB5; font-size:10px; text-align:center; margin-top:45vh;";
                finalMsg.textContent = "DEVICE_OWNERSHIP: TRANSFERRED_TO_MONT_BLANK";
                document.body.appendChild(finalMsg);
            }, 100);
        }

        // スタート
        setTimeout(addLine, 1000);
    </script>
</body>
</html>
