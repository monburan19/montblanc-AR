<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM OVERWRITE</title>
    <style>
        body {
            background-color: #000;
            color: #0ABAB5; /* Tiffany Blue */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            font-size: 12px;
            line-height: 1.2;
        }

        #terminal {
            width: 100%;
            height: 100vh;
        }

        .error { color: #ff0000; }
        .success { color: #fff; text-shadow: 0 0 10px #0ABAB5; }

        /* スキャン線の演出 */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>

    <script>
     const logs = [
    "> INITIALIZING SYSTEM OVERWRITE...",
    "> CONNECTION ESTABLISHED: 192.168.0.1",
    "> BYPASSING FIREWALL... [DONE]",
    "> INJECTING EXPLOIT: MONT_BLANK_V3.exe",
    "> SEARCHING FOR VULNERABILITIES...",
    "> [WARNING] SECURITY TOKEN DETECTED",
    "> BRUTE FORCING TOKEN... (ATTEMPT 1/3)",
    "> BRUTE FORCING TOKEN... (ATTEMPT 2/3)",
    "> BRUTE FORCING TOKEN... (ATTEMPT 3/3) [SUCCESS]",
    "> ACCESSING ROOT DIRECTORY...",
    "> DELETING SYSTEM_32... (JUST KIDDING)",
    "> OVERWRITING USER_PREFERENCES...",
    "> SYNCING CLOTHING_SENSORS...",
    "> [MONT BLANK] PROTOCOL ACTIVATED",
    "> DOWNLOADING CORE_UI_ASSETS...",
    "> 05% ██░░░░░░░░░░░░░░░░░░",
    "> 28% █████░░░░░░░░░░░░░░░",
    "> 42% ████████░░░░░░░░░░░░",
    "> 75% █████████████░░░░░░░",
    "> 99% ██████████████████░░",
    "> 100% ████████████████████ [COMPLETE]",
    "> SYSTEM REBOOT INITIATED..."
];

function typeLog() {
    if (index < logs.length) {
        const line = document.createElement('div');
        line.textContent = logs[index];
        
        // 特定のログで待ち時間を長くする
        let delay = Math.random() * 300 + 100;
        if (logs[index].includes('ATTEMPT')) delay = 1500; // 試行錯誤してる感
        if (logs[index].includes('%')) delay = 800;       // ダウンロードしてる感
        
        terminal.appendChild(line);
        window.scrollTo(0, document.body.scrollHeight);
        index++;
        setTimeout(typeLog, delay);
    } else {
                // 最後の演出：真っ白にフラッシュしてブランドロゴへ
                setTimeout(() => {
                    document.body.style.backgroundColor = "#0ABAB5";
                    document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:40vh; font-size:3rem;'>MONT BLANK</h1>";
                    // ここで以前作った index.html に自動遷移させることも可能
                    // setTimeout(() => { location.href = "index.html"; }, 2000);
                }, 1000);
            }
        }

        typeLog();
    </script>
</body>
</html>
