<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL | SYSTEM OVERWRITE</title>
    <style>
        body {
            background-color: #000;
            color: #0ABAB5; /* Tiffany Blue */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #terminal-container {
            width: 90%;
            max-width: 600px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #terminal {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error { color: #ff3e3e; font-weight: bold; }
        .success { color: #fff; text-shadow: 0 0 8px #0ABAB5; }

        /* Scanning effect */
        .scanline {
            width: 100%; height: 3px;
            background: rgba(10, 186, 181, 0.15);
            position: absolute; top: 0;
            animation: scan 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* Glitch animation for the final line */
        .glitch {
            animation: glitch 1s linear infinite;
        }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
    </style>
</head>
<body>

    <div id="terminal-container">
        <div id="terminal"></div>
        <div class="scanline"></div>
    </div>

    <script>
        const logs = [
            "> BOOTING MONT BLANK OS...",
            "> ENCRYPTING CONNECTION...",
            "> TARGET DEVICE DETECTED: UNKNOWN_USER",
            "> BYPASSING LOCAL FIREWALL... [DONE]",
            "> INJECTING CORE_V3_SCRIPT...",
            "> [WARNING] UNAUTHORIZED ACCESS DETECTED",
            "> BRUTE FORCING SYSTEM_ROOT...",
            "> ACCESS GRANTED.",
            "> FETCHING PERSONAL_DATA...",
            "> [ERROR] ENCRYPTION LOCK FOUND",
            "> OVERWRITING SECURITY_PROTOCOLS...",
            "> SYNCING CLOTHING_INTERFACE...",
            "> APPLYING BRAND_THEME: #0ABAB5",
            "> DATA TRANSFER IN PROGRESS...",
            "> 04% [██░░░░░░░░░░░░░░░░░░]",
            "> 18% [████░░░░░░░░░░░░░░░░]",
            "> 32% [███████░░░░░░░░░░░░░]",
            "> 57% [███████████░░░░░░░░░]",
            "> 81% [████████████████░░░░]",
            "> 99% [███████████████████░]",
            "> 100% [████████████████████]",
            "> ALL FILES OVERWRITTEN.",
            "> ACTIVATING 'MONT BLANK'...",
            "> REBOOTING IN 3...",
            "> REBOOTING IN 2...",
            "> REBOOTING IN 1...",
            "> FATAL ERROR: SYSTEM KERNEL CORRUPTED.",
            "> CONNECTION LOST..."
        ];

        const terminal = document.getElementById('terminal');
        let index = 0;

        function typeLog() {
            if (index < logs.length) {
                const line = document.createElement('div');
                line.textContent = logs[index];
                
                if (logs[index].includes('ERROR')) line.className = 'error';
                if (logs[index].includes('DONE') || logs[index].includes('GRANTED')) line.className = 'success';
                
                // 最後の行だけ少し震えさせる演出
                if (index === logs.length - 1) line.classList.add('glitch');

                terminal.appendChild(line);
                window.scrollTo(0, document.body.scrollHeight);
                
                let delay = Math.random() * 120 + 40;
                if (logs[index].includes('%')) delay = 800;
                if (logs[index].includes('REBOOT')) delay = 1000;
                if (logs[index].includes('FATAL')) delay = 1500;

                index++;
                setTimeout(typeLog, delay);
            }
            // 遷移処理（setTimeout）を削除したため、ここで停止します
        }

        setTimeout(typeLog, 1200);
    </script>
</body>
</html>
